pre-commit:
  jobs:
    - name: lint python
      glob: "*.py" # glob filter
      run: ruff check --config {staged_files}

    - name: lint web
      root: web/
      glob: "*.{js,ts}"
      run: npx eslint {staged_files}

    - name: lint bootstrap installer
      root: apps/bootstrap-installer/
      glob: "*.{js,ts}"
      run: npx eslint {staged_files}

    - name: lint desktop app
      root: apps/desktop/
      glob: "*.{js,ts}"
      run: npx eslint {staged_files}

    - name: lint tui
      root: ui-tui/
      glob: "*.{js,ts}"
      run: npx eslint {staged_files}

    - name: lint shared
      root: apps/shared/
      glob: "*.{js,ts}"
      run: npx eslint {staged_files}

    - name: lint tests
      root: tests-js/
      glob: "*.{js,ts}"
      run: npx eslint {staged_files}
