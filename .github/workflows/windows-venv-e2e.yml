name: Windows venv-holder live E2E

# RF29 probe (temporary, never merges): the relaunched-Desktop retry test, 5x per arch.
on:
  push:
    branches:
      - 'wine2e/**'

permissions:
  contents: read

concurrency:
  group: windows-venv-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rf29:
    name: rf29 retry test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: blacksmith-32vcpu-windows-2025
          - arch: arm64
            runner: windows-latest-32-arm-core
    steps:
      - name: Checkout code
        timeout-minutes: 10
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1

      - name: Set up native ARM64 build dependencies
        timeout-minutes: 20
        if: runner.arch == 'ARM64'
        uses: ./.github/actions/setup-windows-build-deps

      - name: Set up locked Python and test dependencies
        timeout-minutes: 30
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Retry test x5 (sequential)
        timeout-minutes: 30
        shell: bash
        run: |
          set +e -uo pipefail
          fails=0
          for i in 1 2; do
            echo "=== RF29 iteration $i ==="
            bash scripts/run_tests.sh \
              tests/scripts/desktop_update/test_desktop_update_windows_release_holders.py \
              -k close_and_retry -v 2>&1 | tee "rf29-$i.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ] || grep -q "FLAKY" "rf29-$i.log"; then fails=$((fails+1)); echo "RF29 iteration $i: RED (rc=$rc)"; else echo "RF29 iteration $i: GREEN"; fi
          done
          echo "RF29 SUMMARY: $fails of 2 red"
          exit $fails

